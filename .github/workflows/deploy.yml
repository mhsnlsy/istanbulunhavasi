name: Deploy dashboard
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate source and data
        run: |
          test -s index.html
          test -s assets/style.css
          test -s assets/app.js
          python -m py_compile scripts/collect_weather.py
          node --check assets/app.js
          python -m json.tool data/dashboard.json >/dev/null
          python -m json.tool data/mgm-18101.json >/dev/null
          python -m json.tool data/enka-balmumcu.json >/dev/null
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
