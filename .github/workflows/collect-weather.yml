name: Collect and publish Istanbul weather
on:
  push:
    branches: [main]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: istanbul-weather-pipeline
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Collect MGM, ENKA and four GFS cycles
        run: python scripts/collect_weather.py
      - name: Validate generated application and data
        run: |
          python -m py_compile scripts/collect_weather.py
          node --check assets/app.js
          python -m json.tool data/dashboard.json >/dev/null
          python -m json.tool data/mgm-18101.json >/dev/null
          python -m json.tool data/enka-balmumcu.json >/dev/null
      - name: Commit observations and model runs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dashboard.json data/mgm-18101.json data/enka-balmumcu.json
          if git diff --cached --quiet; then
            echo "No new weather samples to publish."
          else
            git commit -m "chore(data): archive Istanbul weather observations"
            git push origin main
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload dashboard artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    runs-on: ubuntu-latest
    needs: collect
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish dashboard
        id: deployment
        uses: actions/deploy-pages@v4
